name: CI

# Every push to main and every pull request runs the same gate as `/verify` locally:
# lint, tests (including the adversarial suite and the evaluation-harness tests, all with fake LLMs: no key, no network),
# the frontend build and tests, and the secret scan. Nothing here calls a paid API.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock
      - name: Install (versions held to the lock file)
        run: pip install -r backend/requirements-dev.txt -c backend/requirements.lock
      - name: Lint
        working-directory: backend
        run: ruff check app tests ../scripts
      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: frontend (build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: No keys, credentials, databases or private documents in the repository
        run: python scripts/check_secrets.py

name: Live evaluation gate

# MANUAL ONLY. Builds the index from the Google Drive folder, runs the golden-set evaluation with the real model, and compares the run with
# the accepted baseline (data/eval/baselines/academic_real_baseline.json) using the gates in backend/app/eval/compare.py.
# It spends a little real money (about one cent per run) and needs repository secrets, so it never runs by itself.
#
# Set up once (Settings > Secrets and variables > Actions):
#   secrets:    OPENAI_API_KEY, DRIVE_SERVICE_ACCOUNT_JSON (the contents of the service-account key file)
#   variables:  OPENAI_CHAT_MODEL, GOOGLE_DRIVE_FOLDER_ID
# Optional: Settings > Environments > "live-eval" > required reviewers, so a person approves each run.
#
# NOTE: written from the documentation; the first run has to be watched (it has not been executed yet).

on:
  workflow_dispatch:
    inputs:
      modes:
        description: "Modes to evaluate (comma list of direct, rag)"
        default: "direct,rag"

permissions:
  contents: read

jobs:
  evaluate:
    name: evaluate and compare with the baseline
    runs-on: ubuntu-latest
    environment: live-eval
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CHAT_MODEL: ${{ vars.OPENAI_CHAT_MODEL }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_AUTH_MODE: service_account
      GOOGLE_DRIVE_CREDENTIALS_FILE: ./secrets/drive-service-account.json
      # The settings the baseline was measured with; the run's config.json records them, and the comparison reports any that differ.
      LLM_REASONING_EFFORT: low
      LLM_MAX_OUTPUT_TOKENS: "800"
      INTENT_LLM_FALLBACK: "true"
      RAG_TOP_K: "8"
      RAG_MAX_DISTANCE: "0.75"
      LOCAL_DOCS_INCLUDE_SYNTHETIC: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-eval.txt
      - name: Install (with the Evidently report)
        run: pip install -r backend/requirements-eval.txt -c backend/requirements-eval.lock
      - name: Write the service-account key (never printed, never committed; secrets/ is git-ignored)
        env:
          KEY_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$KEY_JSON" > secrets/drive-service-account.json
          chmod 600 secrets/drive-service-account.json
      - name: Build the index from Drive
        run: python scripts/sync_drive_once.py
      - name: Evaluate
        run: python scripts/run_evaluation.py --modes "${{ inputs.modes }}" --evidently
      - name: Compare with the baseline (fails the job if a critical gate fails)
        run: python scripts/compare_eval.py latest
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-run
          path: |
            storage/eval/eval-*/config.json
            storage/eval/eval-*/summary.json
            storage/eval/eval-*/results.jsonl
            storage/eval/eval-*/evidently_*.html
          if-no-files-found: warn
          retention-days: 30
